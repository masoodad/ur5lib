name: Publish to PyPI

# Triggers when you publish a GitHub Release (e.g. tag v0.1.0)
on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: pip install build

      - name: Build wheel and source distribution
        run: python -m build

      # Upload the built files so the publish job can access them
      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Required for PyPI Trusted Publishing (no API token needed)
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/ur5lib/

    steps:
      - name: Download dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
